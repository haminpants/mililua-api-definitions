syntax = "proto3";

// Used for fast .gil inspection
message GilFileHeader {
  string name = 2;
}

// Used for .gil resource extraction
message GilFile {
  uint32 save_id = 1;
  string name = 2;
  PrefabAssetContainer prefab_assets = 4;
  StageAssetContainer stage_assets = 5;
  UIComponentBlock ui_component_block = 9;
  NodeGraphData node_graph_data = 10;
  MultiLanguageTextBlock multi_language_text = 35;
  ScriptMappingBlock script_mapping_block = 50;
}

// ======================================================================
// General Comopnents
// ======================================================================

enum VariableType {
  VARIABLE_TYPE_UNSPECIFIED = 0;
  VARIABLE_TYPE_ENTITY = 1;
  VARIABLE_TYPE_GUID = 2;
  VARIABLE_TYPE_INTEGER = 3; // Shared by the Client Control Id type for Script Variables.
  VARIABLE_TYPE_BOOLEAN = 4;
  VARIABLE_TYPE_FLOATING_POINT_NUMBER = 5;
  VARIABLE_TYPE_STRING = 6;
  VARIABLE_TYPE_GUID_LIST = 7;
  VARIABLE_TYPE_INTEGER_LIST = 8; // Shared by the Client Control Id List type for Script Variables.
  VARIABLE_TYPE_BOOLEAN_LIST = 9;
  VARIABLE_TYPE_FLOATING_POINT_LIST = 10;
  VARIABLE_TYPE_STRING_LIST = 11;
  VARIABLE_TYPE_3D_VECTOR = 12;
  VARIABLE_TYPE_ENTITY_LIST = 13;
  VARIABLE_TYPE_3D_VECTOR_LIST = 15;
  VARIABLE_TYPE_FACTION = 17;
  VARIABLE_TYPE_CONFIG_ID = 20;
  VARIABLE_TYPE_PREFAB_ID = 21;
  VARIABLE_TYPE_CONFIG_ID_LIST = 22;
  VARIABLE_TYPE_PREFAB_ID_LIST = 23;
  VARIABLE_TYPE_FACTION_LIST = 24;
  VARIABLE_TYPE_STRUCTURE = 25;
  VARIABLE_TYPE_STRUCTURE_LIST = 26;
  VARIABLE_TYPE_DICTIONARY = 27;
}

enum EntityComponentType {
  ENTITY_COMPONENT_TYPE_UNSPECIFIED = 0;
  ENTITY_COMPONENT_TYPE_CUSTOM_VARIABLE = 1;
}

message EntityComponent {
  EntityComponentType type = 1;
  CustomVariableContainer custom_variables = 11;
}

message CustomVariableContainer {
  repeated CustomVariableEntry entries = 1;
}

message CustomVariableEntry {
  string name = 2;
  VariableDefinitionWrapper variable_definition_wrapper = 4;

  message VariableDefinitionWrapper {
    VariableDefinition variable_definition = 2;
  }
}

message VariableDefinition {
  VariableType type = 1;
  Definition definition = 2;

  message Definition {
    uint32 structure_id = 2;
    VariableType dictionary_key_type = 502;
    VariableType dictionary_value_type = 503;
    uint32 dictionary_value_structure_id = 504;
  }
}

// ======================================================================
// 4. Prefabs
// ======================================================================

message PrefabAssetContainer {
  repeated PrefabAsset assets = 1;
}

message PrefabAsset {
  uint32 index = 1;
  repeated EntityComponent components = 8;
}

// ======================================================================
// 5. Stage Assets (Placed Entities / Templates)
// ======================================================================

message StageAssetContainer {
  repeated StageAsset assets = 1;
}

message StageAsset {
  repeated EntityComponent components = 7;
}

// ======================================================================
// 9. UI Components
// ======================================================================

message UIComponentBlock {
  repeated UIComponent ui_components = 502;
}

message UIComponent {
  uint32 index = 501;
  repeated UIComponentIdentifierMeta identifier_meta = 502;
  repeated UIComponentMeta meta = 505;
}

message UIComponentIdentifierMeta {
  UIComponentIdentifierWrapper identifer_wrapper = 14;
}

message UIComponentIdentifierWrapper {
  bytes identifier_bytes = 501;
}

message UIComponentMeta {
  UIComponentMetaNameWrapper name_wrapper = 12;
  UIComponentTypeIdentifier type_identifier = 502;
}

message UIComponentMetaNameWrapper {
  string name = 501;
}

enum UIComponentTypeIdentifier {
  UI_COMPONENT_TYPE_IDENTIFIER_UNSPECIFIED = 0;
  UI_COMPONENT_TYPE_IDENTIFIER_CLIENT_CONTROL = 86;
}

// ======================================================================
// 10. Node Graphs / Composite Nodes / Signals / Structures
// ======================================================================

message NodeGraphData {
  SignalContainer signal_container = 5;
  repeated StructureBlock structure_blocks = 6;
}

message SignalContainer {
  repeated Signal signals = 3;
}

message Signal {
  string name = 3;
  repeated SignalParameter parameters = 4;
}

message SignalParameter {
  string name = 1;
  VariableType type = 2;
}

message StructureBlock {
  Structure structure = 1;
}

message Structure {
  uint32 id = 1;
  repeated StructureVariable variables = 3;
  string name = 501;
}

message StructureVariable {
  VariableDefinition type_definition = 1;
  string name = 501;
}

// ======================================================================
// 35. Multi-Language Text
// ======================================================================

message MultiLanguageTextBlock {
  MultiLanguageTextWrapper multi_language_text_wrapper = 1;
}

message MultiLanguageTextWrapper {
  ScriptTextVariableContainer script_text_variable_container = 2;
}

message ScriptTextVariableContainer {
  repeated ScriptTextVariable script_text_variables = 1;
}

message ScriptTextVariable {
  string name = 1;
}

// ======================================================================
// 50. Script Mappings
// ======================================================================
message ScriptMappingBlock {
  repeated ScriptMapping script_mappings = 1;
}

message ScriptMapping {
  repeated ScriptVariable script_variables = 7;
}

message ScriptVariable {
  string name = 2;
  VariableType type = 3;
}
